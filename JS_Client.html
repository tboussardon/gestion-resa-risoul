<script>
  function afficherMessage(msg) { document.getElementById('messageBox').innerHTML = '<b>' + msg + '</b>'; }

  function gererSaisieTarif(source) {
    let inputOt = document.getElementById('tarif_ot');
    let inputLibre = document.getElementById('tarif_libre');
    let commission = document.getElementById('commission_ot');
    let restant = document.getElementById('montant_restant');

    if (source === 'ot') {
      if (inputOt.value && parseFloat(inputOt.value) > 0) {
        inputLibre.value = ""; inputLibre.disabled = true; 
        let tarif = parseFloat(inputOt.value);
        let comm = tarif * 0.12; 
        commission.value = comm.toFixed(2);
        restant.value = (tarif - comm).toFixed(2);
      } else {
        inputLibre.disabled = false; commission.value = ""; restant.value = "";
      }
    } 
    else if (source === 'libre') {
      if (inputLibre.value && parseFloat(inputLibre.value) > 0) {
        inputOt.value = ""; inputOt.disabled = true; 
        commission.value = "0.00"; 
        restant.value = parseFloat(inputLibre.value).toFixed(2);
      } else {
        inputOt.disabled = false; commission.value = ""; restant.value = "";
      }
    }
  }

  function calculerMontantManuel() {
    let tarifOt = parseFloat(document.getElementById('tarif_ot').value) || 0;
    let tarifLibre = parseFloat(document.getElementById('tarif_libre').value) || 0;
    let comm = parseFloat(document.getElementById('commission_ot').value) || 0;
    document.getElementById('montant_restant').value = ((tarifOt > 0 ? tarifOt : tarifLibre) - comm).toFixed(2);
  }

  function chercherTarif() {
    const dateSaisie = document.getElementById('searchDate').value;
    if(!dateSaisie) { afficherMessage("Veuillez sélectionner une date de début."); return; }
    
    afficherMessage("Recherche en cours...");
    google.script.run.withSuccessHandler(function(resultat) {
      if(resultat && resultat.erreurDebug) { afficherMessage("<span style='color:red'>" + resultat.erreurDebug + "</span>"); return; }
      
      let inputOt = document.getElementById('tarif_ot'), inputLibre = document.getElementById('tarif_libre');
      inputOt.disabled = false; inputLibre.disabled = false;

      if(resultat && resultat.row) {
        document.getElementById('rowIndex').value = resultat.row;
        document.getElementById('ID_cal_tarifs_26-50').value = resultat.data['ID_cal_tarifs_26-50'] || "";
        document.getElementById('Année').value = resultat.data['Année'] || "";
        document.getElementById('semaine').value = resultat.data['N° Semaine'] || "";
        document.getElementById('Date Début (Samedi)').value = resultat.data['Date Début (Samedi)'];
        document.getElementById('Date Fin (Samedi)').value = resultat.data['Date Fin (Samedi)'];
        
        let tOt = parseFloat(resultat.data['tarif_ot']); inputOt.value = !isNaN(tOt) ? tOt.toFixed(2) : "";
        let tLibre = parseFloat(resultat.data['tarif_libre'] || resultat.data['tarifs_libres']); inputLibre.value = !isNaN(tLibre) ? tLibre.toFixed(2) : "";
        let comm = parseFloat(resultat.data['commission_ot']); document.getElementById('commission_ot').value = !isNaN(comm) ? comm.toFixed(2) : "";
        let mont = parseFloat(resultat.data['montant_restant']); document.getElementById('montant_restant').value = !isNaN(mont) ? mont.toFixed(2) : "";
        
        document.getElementById('btnDelete').style.display = "inline-block";
        afficherMessage("Tarif trouvé !");
        if (inputOt.value && parseFloat(inputOt.value) > 0) gererSaisieTarif('ot');
        else if (inputLibre.value && parseFloat(inputLibre.value) > 0) gererSaisieTarif('libre');
      } else {
        document.getElementById('tarifForm').reset();
        document.getElementById('Date Début (Samedi)').value = dateSaisie; 
        document.getElementById('rowIndex').value = ""; 
        document.getElementById('btnDelete').style.display = "none";
        verifierEtRemplirCalendrier();
        afficherMessage("Aucun tarif trouvé. Vous pouvez en créer un.");
      }
    }).traiterRechercheTarif(dateSaisie);
  }

  function sauvegarderTarif() {
    const dateDebut = document.getElementById('Date Début (Samedi)').value;
    if (!dateDebut) { afficherMessage("<span style='color:red'>Date de début requise.</span>"); return; }
    if (new Date(dateDebut + 'T00:00:00').getDay() !== 6) { afficherMessage("<span style='color:red'>La date de début doit être un samedi !</span>"); return; }

    const form = document.getElementById('tarifForm');
    let formData = {};
    for (let i = 0; i < form.elements.length; i++) if (form.elements[i].name) formData[form.elements[i].name] = form.elements[i].value;
    
    afficherMessage("Sauvegarde en cours...");
    google.script.run.withSuccessHandler(function(msg) {
      afficherMessage(msg.startsWith("ERREUR") ? "<span style='color:red'>" + msg + "</span>" : "<span style='color:green'>" + msg + "</span>");
      if (!msg.startsWith("ERREUR")) document.getElementById('btnDelete').style.display = "none";
    }).traiterSauvegardeTarif(formData, document.getElementById('rowIndex').value);
  }

  function confirmerSuppression() {
    if (confirm("Supprimer définitivement ce tarif ?")) {
       afficherMessage("Suppression en cours...");
       google.script.run.withSuccessHandler(function(msg) {
         if (msg.startsWith("ERREUR")) {
             afficherMessage("<span style='color:red'>" + msg + "</span>");
         } else {
             afficherMessage(msg);
             document.getElementById('tarifForm').reset();
             document.getElementById('btnDelete').style.display = "none";
             document.getElementById('tarif_ot').disabled = false;
             document.getElementById('tarif_libre').disabled = false;
         }
       }).traiterSuppressionTarif(document.getElementById('rowIndex').value);
    }
  }

  function verifierEtRemplirCalendrier() {
    const dateDebut = document.getElementById('Date Début (Samedi)').value;
    if (!dateDebut) return;
    
    document.getElementById('Année').value = dateDebut.split('-')[0];
    let d = new Date(dateDebut); d.setDate(d.getDate() + 7);
    document.getElementById('Date Fin (Samedi)').value = d.toISOString().split('T')[0];
    
    google.script.run.withSuccessHandler(function(infos) {
      if (infos) {
        document.getElementById('Année').value = infos.annee;
        document.getElementById('semaine').value = infos.semaine;
        document.getElementById('Date Fin (Samedi)').value = infos.dateFin;
      }
    }).recupererInfosCalendrier(dateDebut);
  }
</script>
