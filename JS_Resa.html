<script>
  function afficherMessage(msg) { document.getElementById('messageBox').innerHTML = '<b>' + msg + '</b>'; }

  function chercherReservation() {
    const dateSaisie = document.getElementById('searchDate').value;
    if(!dateSaisie) { afficherMessage("Veuillez sélectionner une date."); return; }
    
    afficherMessage("Recherche en cours...");
    google.script.run.withSuccessHandler(function(resultat) {
      if(resultat && resultat.erreurDebug) { afficherMessage("<span style='color:red'>" + resultat.erreurDebug + "</span>"); return; }
      if(resultat && resultat.row) {
        document.getElementById('rowIndex').value = resultat.row;
        document.getElementById('ID_cal_reservation_26-50').value = resultat.data['ID_cal_reservation_26-50'] || "";
        document.getElementById('ID_cal_tarifs_26-50').value = resultat.data['ID_cal_tarifs_26-50'] || "";
        document.getElementById('Année').value = resultat.data['Année'] || "";
        document.getElementById('semaine').value = resultat.data['N° Semaine'] || "";
        document.getElementById('Date Début (Samedi)').value = resultat.data['Date Début (Samedi)'];
        document.getElementById('Date Fin (Samedi)').value = resultat.data['Date Fin (Samedi)'];
        document.getElementById('nom').value = resultat.data['nom'] || "";
        document.getElementById('prenom').value = resultat.data['prenom'] || "";
        document.getElementById('origine_reservation').value = resultat.data['origine_reservation'] || "";
        document.getElementById('etat_station').value = resultat.data['etat_station'] || "";
        document.getElementById('conciergerie').value = resultat.data['conciergerie'] || "";
        document.getElementById('saison').value = resultat.data['saison'] || "";
        
        document.getElementById('btnDelete').style.display = "inline-block";
        afficherMessage("Réservation trouvée !");
      } else {
        document.getElementById('resaForm').reset();
        document.getElementById('Date Début (Samedi)').value = dateSaisie; 
        document.getElementById('rowIndex').value = ""; 
        document.getElementById('btnDelete').style.display = "none";
        verifierEtRemplirCalendrier();
        afficherMessage("Semaine libre. Vous pouvez créer une réservation.");
      }
    }).traiterRechercheReservation(dateSaisie);
  }

  function sauvegarderReservation() {
    const dateDebutVal = document.getElementById('Date Début (Samedi)').value;
    if (!dateDebutVal) { afficherMessage("<span style='color:red'>Veuillez renseigner une date.</span>"); return; }
    if (new Date(dateDebutVal + 'T00:00:00').getDay() !== 6) { afficherMessage("<span style='color:red'>La date de début doit être un samedi !</span>"); return; }

    const form = document.getElementById('resaForm');
    let formData = {};
    for (let i = 0; i < form.elements.length; i++) if (form.elements[i].name) formData[form.elements[i].name] = form.elements[i].value;
    
    afficherMessage("Sauvegarde en cours...");
    google.script.run.withSuccessHandler(function(msg) {
      afficherMessage(msg.startsWith("ERREUR") ? "<span style='color:red'>" + msg + "</span>" : "<span style='color:green'>" + msg + "</span>");
      if (!msg.startsWith("ERREUR")) document.getElementById('btnDelete').style.display = "none";
    }).traiterSauvegardeReservation(formData, document.getElementById('rowIndex').value);
  }

  function confirmerSuppression() {
    if (confirm("Supprimer définitivement cette réservation ?")) {
       afficherMessage("Suppression en cours...");
       google.script.run.withSuccessHandler(function(msg) {
         afficherMessage(msg); document.getElementById('resaForm').reset(); document.getElementById('btnDelete').style.display = "none";
       }).traiterSuppressionReservation(document.getElementById('rowIndex').value);
    }
  }

  function verifierEtRemplirCalendrier() {
    const dateDebut = document.getElementById('Date Début (Samedi)').value;
    if (!dateDebut) return;
    
    document.getElementById('Année').value = dateDebut.split('-')[0];
    let d = new Date(dateDebut); d.setDate(d.getDate() + 7);
    document.getElementById('Date Fin (Samedi)').value = d.toISOString().split('T')[0];
    
    google.script.run.withSuccessHandler(function(infos) {
      if (infos) {
        document.getElementById('Année').value = infos.annee;
        document.getElementById('semaine').value = infos.semaine;
        document.getElementById('Date Fin (Samedi)').value = infos.dateFin;
      }
    }).recupererInfosCalendrier(dateDebut);

    google.script.run.withSuccessHandler(function(infos) {
      document.getElementById('etat_station').value = infos.etat;
      if (document.getElementById('saison')) document.getElementById('saison').value = infos.saison;
    }).getInfosStationParDate(dateDebut);
  }

  window.onload = function() {
    google.script.run.withSuccessHandler(orgs => {
      orgs.forEach(org => document.getElementById('origine_reservation').add(new Option(org, org)));
    }).getOriginesReservation();

    google.script.run.withSuccessHandler(conciergeries => {
      conciergeries.forEach(item => document.getElementById('conciergerie').add(new Option(item, item)));
    }).getConciergeries();
  };
</script>
