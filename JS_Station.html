<script>
  function afficherMessage(msg) { document.getElementById('messageBox').innerHTML = '<b>' + msg + '</b>'; }
  function viderFormulaire() {
    document.getElementById('stationForm').reset(); document.getElementById('searchDate').value = "";
    document.getElementById('rowIndex').value = ""; document.getElementById('ID_cal_station').value = "";
    document.getElementById('btnDelete').style.display = "none"; afficherMessage("");
  }
  function getValeurCle(obj, clesPossibles) {
    if (!obj) return "";
    for (let key in obj) {
      let keyNorm = key.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
      for (let cp of clesPossibles) {
        if (keyNorm === cp.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "")) return obj[key];
      }
    }
    return "";
  }
  
  function determinerSaisonEtAnnee(dateStr) {
    // Note : Reproduction basique ici, le vrai calcul est côté serveur par sécurité.
    if (!dateStr) return null;
    let parts = dateStr.split('-'); let a = parseInt(parts[0], 10), m = parseInt(parts[1], 10), j = parseInt(parts[2], 10);
    if ((m === 6 && j >= 20) || (m === 7 || m === 8) || (m === 9 && j <= 30)) return { saison: "Été", anneeDebut: a, anneeFin: a };
    if (m === 12 || (m >= 1 && m <= 3) || (m === 4 && j <= 25)) {
      let anneeDebut = (m <= 4) ? a - 1 : a; return { saison: "Hiver", anneeDebut: anneeDebut, anneeFin: anneeDebut + 1 };
    }
    return null;
  }

  function chercherStation() {
    const dateSaisie = document.getElementById('searchDate').value;
    if (!dateSaisie) { afficherMessage("<span style='color:red'>Veuillez sélectionner une date.</span>"); return; }
    
    afficherMessage("Recherche en cours...");
    google.script.run.withSuccessHandler(function(resultat) {
      if (resultat && resultat.erreurDebug) { afficherMessage("<span style='color:red'>" + resultat.erreurDebug + "</span>"); return; }
      if (resultat && resultat.row) {
        document.getElementById('rowIndex').value = resultat.row;
        document.getElementById('ID_cal_station').value = getValeurCle(resultat.data, ['ID_cal_station']);
        document.getElementById('ouverture_station').value = getValeurCle(resultat.data, ['ouverture_station']);
        document.getElementById('fermeture_station').value = getValeurCle(resultat.data, ['fermeture_station']);
        calculerInfosAuto();
        document.getElementById('btnDelete').style.display = "inline-block";
        afficherMessage("<span style='color:green'>Période trouvée !</span>");
      } else {
        viderFormulaire();
        document.getElementById('searchDate').value = dateSaisie;
        document.getElementById('ouverture_station').value = dateSaisie; 
        calculerInfosAuto();
        afficherMessage("Aucune période trouvée. Vous pouvez en créer une.");
      }
    }).traiterRechercheStation(dateSaisie);
  }

  function calculerInfosAuto() {
    const dOuv = document.getElementById('ouverture_station').value, dFer = document.getElementById('fermeture_station').value;
    const iEtat = document.getElementById('etat_station'), iSaison = document.getElementById('saison_station'), iAnn = document.getElementById('années_station');

    if (!dOuv) { iEtat.value = ""; iSaison.value = ""; iAnn.value = ""; return false; }
    if (dFer && dFer < dOuv) { iEtat.value = "Fermée"; afficherMessage("<span style='color:red'>❌ Fermeture antérieure à l'ouverture.</span>"); return false; }
    let infoO = determinerSaisonEtAnnee(dOuv);
    if (!infoO) { iEtat.value = "Fermée"; afficherMessage("<span style='color:red'>❌ Date d'ouverture hors créneau.</span>"); return false; }
    if (dFer) {
      let infoF = determinerSaisonEtAnnee(dFer);
      if (!infoF || infoO.saison !== infoF.saison) { iEtat.value = "Fermée"; afficherMessage("<span style='color:red'>❌ Dates incompatibles avec les saisons.</span>"); return false; }
    }
    iEtat.value = "ouverte"; iSaison.value = infoO.saison; iAnn.value = infoO.anneeDebut + '/' + infoO.anneeFin;
    afficherMessage(""); return true;
  }

  function sauvegarderStation() {
    if (!document.getElementById('ouverture_station').value || !document.getElementById('fermeture_station').value) return;
    if (!calculerInfosAuto()) return;

    let formData = {};
    for (let i = 0; i < document.getElementById('stationForm').elements.length; i++) {
      let el = document.getElementById('stationForm').elements[i]; if (el.name) formData[el.name] = el.value;
    }
    afficherMessage("Sauvegarde en cours...");
    google.script.run.withSuccessHandler(function(msg) {
      afficherMessage(msg.startsWith("ERREUR") ? "<span style='color:red'>" + msg + "</span>" : "<span style='color:green'>" + msg + "</span>");
      if (!msg.startsWith("ERREUR")) document.getElementById('btnDelete').style.display = "none";
    }).traiterSauvegardeStation(formData, document.getElementById('rowIndex').value);
  }

  function confirmerSuppression() {
    if (confirm("Supprimer cette période ?")) {
       afficherMessage("Suppression en cours...");
       google.script.run.withSuccessHandler(function(msg) { afficherMessage(msg); viderFormulaire(); }).traiterSuppressionStation(document.getElementById('rowIndex').value);
    }
  }

  window.onload = function() { viderFormulaire(); };
</script>
