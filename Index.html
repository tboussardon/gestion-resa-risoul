<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('CSS'); ?> 
  </head>
  <body>
    <h2>Gestion des Tarifs (26-50)</h2>
    
    <div class="section search-box">
      <label for="searchDate" style="margin:0; min-width: 200px;">Rechercher par date de début :</label>
      <input type="date" id="searchDate">
      <button type="button" onclick="chercherTarif()">Rechercher</button>
    </div>
    
    <form id="tarifForm" class="section">
      <input type="hidden" id="rowIndex" name="rowIndex">
      <input type="hidden" id="ID_cal_tarifs_26-50" name="ID_cal_tarifs_26-50">
      
      <div class="form-row">
        <div class="form-group">
          <label>Année :</label>
          <input type="number" id="Année" name="Année" placeholder="Ex: 2025">
        </div>
        <div class="form-group">
          <label>N° Semaine :</label>
          <input type="number" id="semaine" name="num_semaine" placeholder="Ex: 50">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Date Début (Samedi) :</label>
          <input type="date" id="Date Début (Samedi)" name="Date Début (Samedi)" onchange="verifierEtRemplirCalendrier()">
        </div>
        <div class="form-group">
          <label>Date Fin (Samedi) :</label>
          <input type="date" id="Date Fin (Samedi)" name="Date Fin (Samedi)">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tarif OT (€) :</label>
          <input type="number" id="tarif_ot" name="tarif_ot" step="0.01" oninput="gererSaisieTarif('ot')">
        </div>
        <div class="form-group">
          <label>Tarif Libre (€) :</label>
          <input type="number" id="tarif_libre" name="tarif_libre" step="0.01" oninput="gererSaisieTarif('libre')">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Commission OT (€) :</label>
          <input type="number" id="commission_ot" name="commission_ot" step="0.01" oninput="calculerMontantManuel()">
        </div>
        <div class="form-group">
          <label>Montant Restant (€) :</label>
          <input type="number" id="montant_restant" name="montant_restant" step="0.01" readonly class="readonly-input">
        </div>
      </div>
      
      <div class="actions">
        <button type="button" onclick="sauvegarderTarif()">Enregistrer (Créer / Modifier)</button>
        <button type="button" id="btnDelete" class="danger" style="display:none;" onclick="confirmerSuppression()">Supprimer</button>
      </div>
    </form>
    
    <div id="messageBox"></div>

    <?!= include('JS_Client'); ?>
  </body>
</html>
